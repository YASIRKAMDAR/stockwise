name: StockwiseStaff
options:
  bundleIdPrefix: app.stockwise
  deploymentTarget:
    iOS: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StockwiseStaff:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stockwise.staff
        PRODUCT_NAME: StockwiseStaff
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Stockwise
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Stockwise listens while you hold the mic, to record the job you say."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Stockwise turns what you say into the job to record."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
  StockwiseStaffTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: StockwiseStaff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stockwise.staff.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StockwiseStaff.app/StockwiseStaff"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  StockwiseStaff:
    build:
      targets:
        StockwiseStaff: all
        StockwiseStaffTests: [test]
    test:
      targets: [StockwiseStaffTests]
