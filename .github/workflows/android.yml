name: Android app (APK)

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.9' }

      # Your own signing key, stored as GitHub secrets (never in the repo).
      # Without it the APK is signed with a throwaway test key: it installs and works,
      # but shows a thin address bar because the website can't verify it.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "STOCKWISE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=your release key" >> "$GITHUB_ENV"
          else
            echo "SIGNED_WITH=a test key (add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets for full-screen)" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          STOCKWISE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk "Stockwise-1.0.${{ github.run_number }}.apk"

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Stockwise Android 1.0.${{ github.run_number }}
          make_latest: true
          files: Stockwise-1.0.${{ github.run_number }}.apk
          body: |
            Android app for Stockwise. It opens https://stockwise-ten-ivory.vercel.app inside Chrome, so voice works the same as on the web.
            Signed with ${{ env.SIGNED_WITH }}.

            Install: download the APK on the phone, open it, and allow "Install unknown apps" for your browser when asked. Chrome must be installed on the phone.
