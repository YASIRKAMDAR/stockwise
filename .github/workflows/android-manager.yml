name: Manager app (native Android)

on:
  push:
    branches: [main]
    paths: ['android-manager/**', '.github/workflows/android-manager.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.9' }

      - name: Signing key (repo secrets; a test key is used without them)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "STOCKWISE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=your release key" >> "$GITHUB_ENV"
          else
            echo "SIGNED_WITH=a test key" >> "$GITHUB_ENV"
          fi

      - name: Render screens (Roborazzi)
        working-directory: android-manager
        run: gradle :app:recordRoborazziDebug --no-daemon
        continue-on-error: true

      - name: Build APK
        working-directory: android-manager
        env:
          STOCKWISE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Collect files
        run: |
          mkdir -p out
          cp android-manager/app/build/outputs/apk/release/app-release.apk "out/Stockwise-Manager-1.0.${{ github.run_number }}.apk"
          if ls android-manager/app/build/screens/*.png >/dev/null 2>&1; then (cd android-manager/app/build/screens && zip -q "$GITHUB_WORKSPACE/out/screens.zip" *.png); fi
          ls -la out

      - name: Test report (if screen rendering failed)
        if: always()
        run: |
          f=$(ls android-manager/app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -1)
          [ -n "$f" ] && grep -A5 "<failure" android-manager/app/build/test-results/testDebugUnitTest/*.xml | head -60 || true

      - name: Stable "latest" link for the install page
        run: cp out/Stockwise-Manager-1.0.${{ github.run_number }}.apk "out-latest-Stockwise-Manager.apk" && mkdir -p latest && mv "out-latest-Stockwise-Manager.apk" "latest/Stockwise-Manager.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-manager-latest
          name: Stockwise Manager (Android) — latest
          make_latest: false
          files: latest/Stockwise-Manager.apk
          body: Always the newest build. Linked from /android on the website. Version 1.0.${{ github.run_number }}.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manager-native-v1.0.${{ github.run_number }}
          name: Stockwise Manager (native) 1.0.${{ github.run_number }}
          make_latest: false
          files: out/*
          body: |
            Native Android app for hotel managers: ask the store by voice, weekly count hands-free, deliveries, activity. Signed with ${{ env.SIGNED_WITH }}.
            Sign in with your code and passcode. Hold the mic to speak, or type; works with Android's own speech recognition.
